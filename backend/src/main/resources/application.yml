server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/example_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.lostfound.entity

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_at_least_32_bytes_long_change_in_production}
  expiration: 86400000

wechat:
  appid: ${WECHAT_APPID:wx161d667f97b15ac1}
  secret: ${WECHAT_SECRET:your_wechat_app_secret}

zhipu:
  api-key: ${ZHIPU_API_KEY:your_zhipu_api_key}

logging:
  level:
    com.example.lostfound: DEBUG
    com.baomidou.mybatisplus: DEBUG