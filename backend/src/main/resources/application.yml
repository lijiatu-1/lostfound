server:
  port: ${PORT:8080}

app:
  public-api-base-url: ${PUBLIC_API_BASE_URL}

spring:
  profiles:
    default: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    auto-mapping-behavior: full
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.lostfound.entity

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
wechat:
  appid: ${WECHAT_APPID}
  secret: ${WECHAT_SECRET}
zhipu:
  api-key: ${ZHIPU_API_KEY:}
ai:
  daily-limit: ${AI_DAILY_LIMIT:5}
  enabled: ${AI_ENABLED:false}
media:
  upload-dir: ${MEDIA_UPLOAD_DIR}
  max-upload-bytes: 5242880
  max-pixels: 16000000

logging:
  level:
    com.example.lostfound: INFO
