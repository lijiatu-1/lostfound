spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/example_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    baseline-on-migrate: true
app:
  public-api-base-url: http://localhost:8080/api
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
logging:
  level:
    com.example.lostfound: DEBUG
media:
  upload-dir: ${MEDIA_UPLOAD_DIR:uploads/media}
